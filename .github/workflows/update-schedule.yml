# Парсер расписания: скачать PDF → JSON в schedule_json/ → коммит в репозиторий.
# На PythonAnywhere настройте Scheduled task: git pull (см. .env.example).

name: Update schedule JSON

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser dependencies
        run: pip install -r requirements-parser.txt

      - name: Run schedule parser
        env:
          SCHEDULE_PDF_URL: ${{ secrets.SCHEDULE_PDF_URL }}
        run: |
          if [ -z "$SCHEDULE_PDF_URL" ]; then
            echo "SCHEDULE_PDF_URL secret is not set — skip"
            exit 0
          fi
          python schedule_parser.py --url "$SCHEDULE_PDF_URL" -o schedule_json

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule_json/
          if git diff --staged --quiet; then
            echo "No schedule changes"
            exit 0
          fi
          git commit -m "chore: update schedule_json from PDF"
          git push
