# Render Blueprint: один Web-сервис = сайт + API + бот.
# Парсер — только GitHub Actions → коммит schedule_json/ → auto-deploy.

services:
  - type: web
    name: vetschedule
    runtime: python
    plan: free
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /api/groups
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SITE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: SCHEDULE_PDF_URL
        value: ""
      - key: DATABASE_URL
        value: sqlite:///./schedule.db
      - key: SCHEDULE_DIR
        value: schedule_json
      - key: UPLOADS_DIR
        value: uploads
      - key: API_HTTP_TIMEOUT
        value: "60"
